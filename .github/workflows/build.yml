name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ch341pardemo-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ch341pardemo-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Lint check
        run: ./gradlew lintDebug --no-daemon
        continue-on-error: true

  verify:
    name: Verify bridge source
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Check TermuxBridge uses LocalSocket (not raw TCP for security)
        run: |
          if grep -q "new ServerSocket" app/src/main/java/cn/wch/ch341pardemo/TermuxBridge.java; then
            echo "::error::TermuxBridge still uses raw ServerSocket on port $PORT. Migrate to LocalServerSocket for security."
            exit 1
          fi
          echo "PASS: No raw ServerSocket found."
      - name: Check UsbRequest async usage
        run: |
          if ! grep -q "UsbRequest" app/src/main/java/cn/wch/ch341pardemo/TermuxBridge.java; then
            echo "::warning::UsbRequest async I/O not used. Performance will suffer."
          fi
          echo "OK: Async check complete."
